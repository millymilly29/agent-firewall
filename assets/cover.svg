<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .bone-bg { fill: #F2F0EB; }
      .headline {
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Arial Narrow', 'Impact', sans-serif;
        font-size: 72px;
        font-weight: 900;
        letter-spacing: -0.04em;
        text-transform: uppercase;
        fill: #1A1917;
      }
      .mono-label {
        font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <rect width="1200" height="630" class="bone-bg"/>
  <rect x="60" y="60" width="1080" height="510" fill="none" stroke="#C8C5BE" stroke-width="1"/>

  <g transform="translate(920, 90)">
    <rect x="2" y="2" width="190" height="38" fill="#1A1917"/>
    <rect x="0" y="0" width="190" height="38" fill="#FFFFFF" stroke="#1A1917" stroke-width="1"/>
    <text x="95" y="24" class="mono-label" font-size="12px" font-weight="700" fill="#1A1917" text-anchor="middle">N° 01 — OBJECT</text>
  </g>

  <g transform="translate(680, 200)">
    <rect x="2" y="2" width="180" height="180" fill="#1A1917"/>
    <rect x="0" y="0" width="180" height="180" fill="#FFFFFF" stroke="#1A1917" stroke-width="1.5"/>
    
    <polygon points="90,30 145,55 145,115 90,155 35,115 35,55" fill="none" stroke="#1A1917" stroke-width="2"/>
    <polygon points="90,50 125,68 125,105 90,132 55,105 55,68" fill="none" stroke="#8A867D" stroke-width="1"/>
    <text x="90" y="100" class="mono-label" font-size="11px" font-weight="700" fill="#1A1917" text-anchor="middle">SEC</text>
  </g>

  <g transform="translate(100, 260)">
    <text x="0" y="0" class="mono-label" font-size="13px" font-weight="700" fill="#8A867D">N° 01 — COMMAND SCANNER</text>
    <text x="0" y="64" class="headline">AGENT — FIREWALL</text>
    <text x="0" y="110" class="mono-label" font-size="12px" fill="#8A867D">
      DETERMINISTIC AST SAFETY  ·  SHA-256 AUDIT CHAIN  ·  DRY-RUN GATEWAY
    </text>
  </g>

  <g transform="translate(100, 520)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#C8C5BE" stroke-width="1"/>
    <text x="0" y="25" class="mono-label" font-size="11px" fill="#8A867D">
      SPECIFICATION: 10 THREAT RULES  ·  ZERO RUNTIME DEPENDENCIES
    </text>
    <text x="1000" y="25" class="mono-label" font-size="11px" fill="#8A867D" text-anchor="end">
      TESTS: 9/9 PASS
    </text>
  </g>
</svg>
